# Add dsh-tool-app-verify to a dsh profile.
# Place in cordis.patch.yml or pass via: dsh --profile web --patch ./cordis.example.yml

- id: app-verify
  plugin: dsh-tool-app-verify
  config:
    mode: browser
    headless: true
    timeout: 30000
    baselinePath: .app-verify/baselines
    diffThreshold: 0.1
    viewport:
      width: 1280
      height: 720
